id: ubden-hsts-missing
info:
  name: "HTTPS yanıtında HSTS başlığı yok"
  author: ubden
  severity: low
  description: "HTTPS kök yoluna tek HEAD isteği gönderir. Eşleşme analist doğrulaması bekleyen gözlemdir."
  tags: ubden,baseline,readonly
http:
  - method: HEAD
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: header
        regex:
          - "(?im)^strict-transport-security\\s*:"
        negative: true
