id: ubden-nosniff-missing
info:
  name: "HTTPS yanıtında X-Content-Type-Options başlığı yok"
  author: ubden
  severity: info
  description: "HTTPS kök yoluna tek HEAD isteği gönderir. Eşleşme analist doğrulaması bekleyen gözlemdir."
  tags: ubden,baseline,readonly
http:
  - method: HEAD
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: header
        regex:
          - "(?im)^x-content-type-options\\s*:"
        negative: true
