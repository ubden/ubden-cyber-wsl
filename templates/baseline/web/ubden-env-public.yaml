id: ubden-env-public
info:
  name: ".env yapılandırma dosyası dışarıdan okunabiliyor olabilir"
  author: ubden
  severity: medium
  description: "Açıkça seçilen hedefe tek GET isteği gönderir. Eşleşme analist doğrulaması bekleyen gözlemdir."
  tags: ubden,baseline,readonly
http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - "(?m)^(APP_ENV|APP_KEY|DB_HOST|DB_PASSWORD|AWS_ACCESS_KEY_ID)\\s*="
