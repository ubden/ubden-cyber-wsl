id: ubden-prometheus-public
info:
  name: "Prometheus metrikleri dışarıdan okunabiliyor olabilir"
  author: ubden
  severity: low
  description: "Açıkça seçilen hedefe tek GET isteği gönderir. Eşleşme analist doğrulaması bekleyen gözlemdir."
  tags: ubden,baseline,readonly
http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "# HELP"
