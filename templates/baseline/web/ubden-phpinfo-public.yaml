id: ubden-phpinfo-public
info:
  name: "phpinfo sayfası açık olabilir"
  author: ubden
  severity: medium
  description: "Açıkça seçilen hedefe tek GET isteği gönderir. Eşleşme analist doğrulaması bekleyen gözlemdir."
  tags: ubden,baseline,readonly
http:
  - method: GET
    path:
      - "{{BaseURL}}/phpinfo.php"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "phpinfo()"
